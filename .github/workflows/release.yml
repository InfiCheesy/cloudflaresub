# 自动打包：发布新版本（打 v* 标签）时，把两个部署包做好并挂到 Release 里，
# 访客在 Releases 页面就能直接下载现成的包，不用自己从源码制作。
#
# 触发方式（任选其一）：
#   1. GitHub 网页：Releases → Draft a new release → 新建标签如 v1.0.0 → Publish
#   2. 命令行：git tag v1.0.0 && git push origin v1.0.0
#   3. Actions 页面手动 Run workflow（会自动生成一个日期版本号的 Release）
name: 打包发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 跑测试（不过不发版）
        run: npm run check

      - name: 校验两个 worker 文件一致（测试测 src、部署用 public/_worker.js）
        run: cmp src/worker.js public/_worker.js

      - name: 校验版本号与标签一致（手动触发的日期版本除外）
        if: github.ref_type == 'tag'
        run: |
          app_version=$(grep -o "const APP_VERSION = '[^']*'" src/worker.js | head -1 | cut -d"'" -f2)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$app_version tag=$tag_version"
          test "$app_version" = "$tag_version"

      - name: 制作直传扁平包（public 里的文件摊平到 zip 根目录）
        run: |
          cd public
          zip -r ../cloudflaresub-pages-upload.zip .
          cd ..

      - name: 制作整仓库包（git 归档，不含 .git）
        run: git archive --format=zip -o cloudflaresub-pages.zip HEAD

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(date +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布 Release 并挂上两个包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            cloudflaresub-pages-upload.zip \
            cloudflaresub-pages.zip \
            --title "${{ steps.ver.outputs.tag }}" \
            --notes "本项目基于 InfiCheesy/cloudflaresub 修改（Workers → Pages 迁移版），相比原项目新增/修复的特性详见仓库 README 开头的「相比原项目，本版本的主要变化」。

          下载说明：
          - **在 Cloudflare Pages 里直接上传部署** → 下载 \`cloudflaresub-pages-upload.zip\`，不用解压、整个 zip 直接拖进 Pages 的上传框即可（部署步骤见仓库 README 的方式 A）
          - **连接 GitHub 自动部署 / 保存源码** → 用仓库代码即可，或下载 \`cloudflaresub-pages.zip\` 整仓库包"

      - name: 生成校验和并补挂到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum cloudflaresub-pages-upload.zip cloudflaresub-pages.zip > SHA256SUMS.txt
          gh release upload "${{ steps.ver.outputs.tag }}" SHA256SUMS.txt
